# Plantilla de pyproject.toml para un proyecto Python profesional.
# Reemplazar los campos marcados con REEMPLAZAR.

[project]
name = "REEMPLAZAR-nombre-proyecto"
version = "0.1.0"
description = "REEMPLAZAR descripcion en una linea."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "REEMPLAZAR equipo" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pyright>=1.1",
]

[project.urls]
Homepage = "REEMPLAZAR url"

[project.scripts]
REEMPLAZAR-cli = "REEMPLAZAR_paquete.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/REEMPLAZAR_paquete"]

# --------------------------------------------------------------------------
# Ruff: lint y format
# --------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8 naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # shadowing de builtins
    "C4",   # comprehensions
    "SIM",  # simplificaciones
    "RUF",  # reglas propias de ruff
    "S",    # bandit (seguridad)
    "ANN",  # anotaciones faltantes
    "ASYNC",
    "T20",  # print() en produccion
    "PT",   # estilo de pytest
]
ignore = [
    "ANN101",  # self no necesita anotacion
    "ANN102",  # cls no necesita anotacion
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "T20", "PT011"]
"scripts/**" = ["T20"]
"migrations/**" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
known-first-party = ["REEMPLAZAR_paquete"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# --------------------------------------------------------------------------
# mypy: tipos en modo estricto
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# --------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
