name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Calidad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Tipos
        run: mypy app

      - name: Tests
        run: pytest -q --cov=app --cov-report=xml --cov-report=term-missing

      - name: Subir cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  security:
    name: Seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Auditar dependencias de Python
        run: |
          pip install pip-audit
          pip-audit --strict

      - name: Auditar dependencias de Node
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Buscar secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build de imagen
    needs: [quality, frontend, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Probar que la imagen levanta
        run: |
          docker run -d --name test -p 8000:8000 app:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "La imagen responde"
              exit 0
            fi
            sleep 2
          done
          echo "La imagen no responde"
          docker logs test
          exit 1

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ github.sha }}
          path: |
            app.tar
          retention-days: 7
