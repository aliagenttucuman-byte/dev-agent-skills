# ---------------------------------------------------------------- gaps detectados
# Donde el kit no cubrio algo y senotationo durante un proyecto real.
gaps:
  - date: "2026-11-11"
    area: tooling
    finding: >
      El scanner no detectaba caracteres corruptos (CJK, hangul, cirilico).
      Tres skills ya publicadas tenian ideogramas colados por autocompletado
      que nadie habia notado.
    resolution: >
      Se agrego el check corrupted-char a scan_clean.py, con una allowlist
      explicita de caracteres de dibujo de cajas para los arboles de carpetas.
    lesson: >
      Un scanner que no verifica la ortografia de los caracteres no verifica la
      genericidad. Los caracteres no esperados son el sintoma de un LLM escribiendo
      con otro tokenizer.

  - date: "2026-11-11"
    area: tooling
    finding: >
      El instalador apuntaba a dev-agent-kit/skills, pero las skills se movieron
      a dev-agent-skills/skills tras separar los repos. El smoke test nunca se
      habia corrido, asi que el fallo estaba invisible.
    resolution: >
      El instalador resuelve el origen por variable de entorno, repo hermano o
      fallback monorepo. El smoke test ahora corre en verde 5/5.
    lesson: >
      Los tests que existen pero no se ejecutan son Worse que no tenerlos: dan
      una sensacion de cobertura que no existe.

  - date: "2026-11-11"
    area: tooling
    finding: >
      El manifest declaraba 24 skills y solo existian 21. La instalacion por
      perfiles fallaba en silencio para las verticales ausentes.
    resolution: >
      Se reconcilio el manifest contra el filesystem: 25 declaradas, 25 reales,
      cero discrepancias. Las verticales RAG, browser y documentos se quitaron
      del manifest hasta que existan.
    lesson: >
      Un inventario de skills tiene que ser generado, no mantenido a mano. La
      verificacion cruzada contra el filesystem es la unica que no miente.

  - date: "2026-11-11"
    area: tooling
    finding: >
      La denylist de forbidden_terms.py vive en un repo publico con los nombres
      exactos de los clientes que se quiere excluir.
    resolution: >
      Resuelto. La denylist literal salio del repo publico y ahora vive en
      ~/.config/dev-agent-kit/denylist.local.json, que no se versiona. El repo
      publica solo reglas estructurales que detectan la clase de
      contaminacion sin nombrar a nadie. El scanner reporta los terminos
      privados por hash (privado#8d2a6a7c54) para que el log de CI no filtre
      el nombre; --private-labels los muestra en uso local.
    lesson: >
      Excluir el dato del producto no alcanza si el nombre del dato aparece en
      la lista de exclusion publicada. La lista de prohibiciones es tan
      sensible como lo que prohibe: tiene que vivir fuera del repo.
    status: resuelto

